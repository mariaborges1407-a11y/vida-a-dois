<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F0EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vida a Dois">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Vida a Dois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --cream:#F7F0EC; --cream2:#EFE3DC;
  --maroon:#94505B; --maroon-soft:#C98F97;
  --olive:#858B57; --olive-soft:#B7BC8C;
  --walnut:#9C7659; --walnut-soft:#CDB097;
  --ink:#3B2A2C; --muted:#7E6A68; --line:rgba(120,80,80,.16);
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --glass-edge:rgba(255,255,255,.8);
  --shadow:0 8px 30px rgba(110,60,60,.10);
  --serif:"Cormorant Garamond", "Times New Roman", Georgia, serif;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
   radial-gradient(40% 35% at 12% 8%, rgba(201,143,151,.55), transparent 70%),
   radial-gradient(45% 40% at 95% 20%, rgba(183,188,140,.55), transparent 70%),
   radial-gradient(50% 40% at 80% 95%, rgba(205,176,151,.55), transparent 70%),
   radial-gradient(40% 35% at 5% 80%, rgba(239,227,220,.9), transparent 70%),
   var(--cream);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--maroon);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--glass-edge);border-radius:20px;box-shadow:var(--shadow)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px 16px 0}
.top-in{max-width:560px;margin:0 auto;display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;padding:10px 18px 10px 14px;border-radius:999px}
.brand{text-align:right}
.brand{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.2px;line-height:1}
.brand small{display:block;font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.menu-btn{border:1px solid var(--line);background:var(--glass-strong);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

main{max-width:560px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.05;margin:6px 0 0;text-wrap:balance}
h2{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.15;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{padding:18px}
.card > * + *{margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--serif);font-size:54px;font-weight:600;line-height:1}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}

.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;background:var(--maroon);color:#fff;box-shadow:0 4px 14px rgba(148,80,91,.28)}
.btn.olive{background:var(--olive);box-shadow:0 4px 14px rgba(133,139,87,.28)}
.btn.ghost{background:var(--glass-strong);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--maroon);border:1px solid var(--maroon-soft);box-shadow:none}
.btn.sm{padding:7px 13px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.link{background:none;border:0;padding:0;color:var(--maroon);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:500}
.item .s{font-size:12.5px;color:var(--muted)}
.tap{width:100%;text-align:left;background:none;border:0;padding:0}
.item.tap{padding:12px 0;border-top:1px solid var(--line)}
.item.tap:first-child{border-top:0}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:rgba(133,139,87,.18);color:#5d6238}
.pill.due{background:rgba(148,80,91,.14);color:var(--maroon)}
.pill.inv{background:rgba(156,118,89,.18);color:#6f5139}

.bar{height:10px;border-radius:999px;background:rgba(120,80,80,.1);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.empty{padding:14px 0;color:var(--muted);font-size:14px}

.balance{padding:16px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--glass-edge)}
.balance .who{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15}

.banner{padding:10px 14px;border-radius:14px;background:rgba(148,80,91,.12);color:var(--maroon);font-size:13px}
.hero-photo{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:cover;border-radius:16px;display:block;background:var(--cream2)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(59,42,44,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);z-index:41;transform:translateX(-105%);transition:transform .25s ease;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 22px);border-radius:0 24px 24px 0;background:rgba(250,244,240,.82);display:flex;flex-direction:column;gap:4px}
.drawer.on{transform:none}
.drawer .eyebrow{margin:0 10px 10px}
.nav{background:none;border:0;text-align:left;padding:12px 12px;border-radius:14px;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink)}
.nav.on{background:var(--glass-strong);color:var(--maroon)}
.drawer .close{margin-top:auto}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 22px);border-radius:24px 24px 0 0;background:rgba(250,244,240,.92)}
.sheet.on{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.scrim2{z-index:50}
form{display:flex;flex-direction:column;gap:12px}
label.f,div.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.8);font-size:16px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.7);font-size:14px;font-weight:500;cursor:pointer;text-transform:none;letter-spacing:0;color:var(--ink)}
.seg input:checked + label{background:var(--maroon);border-color:var(--maroon);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;padding:12px;border-radius:12px;background:rgba(255,255,255,.6);border:1px solid var(--line)}
.chk input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--maroon)}
.seg input:focus-visible + label{outline:2px solid var(--maroon);outline-offset:2px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mtitle{text-transform:capitalize;white-space:nowrap;font-size:22px;text-align:center;flex:1}
.arrow{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass-strong);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.arrow svg{width:18px;height:18px}
.arrow:active{transform:scale(.94)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;font-weight:600;text-align:center;color:var(--muted);letter-spacing:.06em;padding-bottom:4px}
.day{aspect-ratio:1/1.12;min-width:0;border:1px solid transparent;border-radius:12px;background:rgba(255,255,255,.35);padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-variant-numeric:tabular-nums}
.day.out{visibility:hidden}
.day{position:relative}
.ringdot{position:absolute;top:2px;right:2px;width:13px;height:13px;color:#E0679A;line-height:0}
.ringdot svg{width:100%;height:100%;overflow:visible}
.ringdot path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}
.ringdot.ins path{fill:currentColor;stroke-width:1.2}
.legend .rd{position:static;display:inline-block;width:14px;height:14px}
.day.today{border-color:var(--maroon);background:rgba(255,255,255,.75);font-weight:700}
.day.we{color:var(--walnut)}
.tags{display:flex;flex-direction:column;gap:2px;width:100%;margin-top:auto}
.tag{height:6px;border-radius:3px}
.tag.arr{width:45%;align-self:flex-end}
.day.both{background:linear-gradient(145deg,rgba(255,255,255,.55) 0%,rgba(201,143,151,.38) 45%,rgba(148,80,91,.34) 100%);border:1px solid rgba(255,255,255,.85);-webkit-backdrop-filter:blur(10px) saturate(160%);backdrop-filter:blur(10px) saturate(160%);box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -2px 6px rgba(148,80,91,.18),0 4px 12px rgba(148,80,91,.18);color:var(--ink);font-weight:600}
.day.both.we{color:var(--ink)}
.legend i.both{width:14px;height:14px;border-radius:4px;background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(201,143,151,.38) 45%,rgba(148,80,91,.34));border:1px solid rgba(255,255,255,.85);box-shadow:0 2px 5px rgba(148,80,91,.2)}
.legend i.arr{width:9px}
.t-bruno{background:#94505B} .t-ferias1{background:#5E8A3A} .t-ferias2{background:#3F78A8} .t-periodo{background:#E3A23B}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:8px;border-radius:4px}

/* photos */
.albums{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.album{padding:8px;border-radius:18px;text-align:left}
.album .cover{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:linear-gradient(135deg,var(--cream2),var(--walnut-soft));display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;color:var(--muted)}
.album .n{padding:8px 4px 2px;font-weight:600}
.album .c{padding:0 4px 4px;font-size:12px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{padding:0;border:0;background:var(--cream2);border-radius:10px;overflow:hidden;aspect-ratio:1}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos button{position:relative}
.photos .sel{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);box-shadow:0 1px 4px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.photos .on .sel{background:var(--maroon)}
.photos .on img{opacity:.75}
.photos .sel svg{width:14px;height:14px}
.selbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:25;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:999px}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(30,20,22,.92);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);gap:12px}
.lightbox img{flex:1;min-height:0;width:100%;object-fit:contain}
.lightbox .row .btn.ghost{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25)}
.lightbox .btn.danger{color:#f3c9ce;border-color:#b57f87}

/* página inicial */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;padding:16px;min-height:150px;border-radius:20px;color:var(--ink);width:100%}
.tile.wide{min-height:0;gap:6px}
.tile .tile-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.tile .ico{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(148,80,91,.10);color:var(--maroon)}
.tile .ico svg{width:17px;height:17px}
.tile .chev{font-size:20px;line-height:1;color:var(--muted);opacity:.6}
.tile .eyebrow{font-size:10.5px}
.tile .tv{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1}
.tile .ts{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:auto}
.tile.wide .ts{margin-top:0}
.tile.hero .big{font-size:58px}
.tile.alert .ico{background:rgba(148,80,91,.18)}
.tile.alert{border-color:rgba(148,80,91,.35)}
.tile .mini{display:flex;gap:2px;height:5px;margin:4px 0 2px}
.tile .mini i{display:block;height:100%;border-radius:3px}
.tile .mini i.m{background:var(--c-p1)} .tile .mini i.b{background:var(--c-p2)}
.tile:active{transform:scale(.985)}
@media (max-width:350px){.tiles{grid-template-columns:1fr}}
/* painel das viagens */
:root{--c-p1:#A8465A;--c-p2:#6E8F3A}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:10px 12px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--glass-edge)}
.kpi .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{font-size:11px;color:var(--muted);letter-spacing:.04em}
.sbar{display:flex;gap:2px;height:14px;min-width:6px}
.sbar i{display:block;height:100%;min-width:3px;cursor:pointer}
.sbar i:last-child{border-radius:0 4px 4px 0}
.sbar.full i:first-child{border-radius:4px 0 0 4px}
.sbar i.m{background:var(--c-p1)} .sbar i.b{background:var(--c-p2)}
.sbar.one i{background:var(--maroon)}
.track{background:rgba(120,80,80,.08);border-radius:4px}
.key{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.key.m{background:var(--c-p1)} .key.b{background:var(--c-p2)}
.who2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who2 .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.catrow{display:flex;flex-direction:column;gap:5px}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.colw{display:flex;flex-direction:column;align-items:center;gap:4px}
.colb{height:110px;width:100%;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--line)}
.colb i{display:block;width:60%;max-width:24px;border-radius:4px 4px 0 0;cursor:pointer}
.colb i.m{background:var(--c-p1)} .colb i.b{background:var(--c-p2)} .colb i.dim{opacity:.45}
.colv{font-size:11px;color:var(--muted);min-height:14px}
.coll{font-size:11.5px;color:var(--muted);text-transform:capitalize}
.segb{flex:1;padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.7);font-size:14px;font-weight:500}
.segb.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.seg[role=tablist]{flex-wrap:nowrap}
.tip{position:fixed;z-index:80;pointer-events:none;padding:7px 11px;border-radius:10px;background:var(--ink);color:#fff;font-size:13px;line-height:1.35;max-width:220px;box-shadow:0 6px 18px rgba(0,0,0,.2);transform:translate(-50%,calc(-100% - 10px))}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;transition:all .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.fab{position:fixed;z-index:30;right:max(20px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:62px;height:62px;border-radius:50%;border:0;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(148,80,91,.45),0 2px 6px rgba(59,42,44,.18);transition:transform .15s ease,box-shadow .15s ease}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.93)}
.fab:disabled{opacity:.6}
.fab .fab-busy{font-size:11px;font-weight:600;line-height:1.1;text-align:center;padding:0 4px}
body.has-fab main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
body.has-fab .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
main{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
input,select,textarea{font-size:16px}
input[type=date].inp{-webkit-appearance:none;appearance:none;display:block;min-height:46px;line-height:1.3;text-align:left}
input[type=date].inp::-webkit-date-and-time-value{text-align:left}
.dates2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in glass">
    <div class="brand">Vida a Dois<small id="brandSub">Maria e Bruno</small></div>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="drawer">Menu</button>
  </div>
</header>

<main id="main"></main>

<div class="scrim" id="scrim"></div>
<nav class="drawer glass" id="drawer" aria-label="Secções">
  <div class="eyebrow">Secções</div>
  <button class="nav" data-go="home">Início</button>
  <button class="nav" data-go="trips">Viagens</button>
  <button class="nav" data-go="invest">Investimentos</button>
  <button class="nav" data-go="mine">Os meus gastos</button>
  <button class="nav" data-go="cal">Calendário</button>
  <button class="nav" data-go="photos">Fotos</button>
  <button class="nav" data-go="settings">Configurações</button>
  <button class="nav" data-act-drawer="logout" style="font-size:18px;color:var(--muted)">Terminar sessão</button>
  <button class="btn ghost close" id="drawerClose">Fechar</button>
</nav>

<div class="scrim scrim2" id="scrim2"></div>
<section class="sheet glass" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheetBody"></div></section>
<div class="lightbox" id="lightbox" hidden></div>
<div class="toast" id="toast" role="status"></div>
<div class="tip" id="tip" hidden></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<script src="local-store.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="sync.js"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"});
const money = n => eur.format(Math.round((+n||0)*100)/100);
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const todayStr = () => ymd(new Date());
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const fmtDate = s => { const d = parseYmd(s); return d.getDate()+" de "+MESES[d.getMonth()]; };
const CATS = ["Alojamento","Transporte","Comida","Atividades","Compras","Outros"];
const CAT_LABEL = {Alojamento:"Alojamento", Transporte:"Transportes", Comida:"Alimentação e bebidas", Atividades:"Atividades e lazer", Compras:"Compras", Outros:"Outras despesas"};
const catL = c => CAT_LABEL[c] || c || CAT_LABEL.Outros;
const splitLabel = (split, payer) => split==="igual" ? "Repartida em partes iguais" : "Imputada a "+N(split==="outro" ? other(payer) : payer);
const CAT_COLORS = ["var(--maroon)","var(--olive)","var(--walnut)","var(--maroon-soft)","var(--olive-soft)","var(--walnut-soft)"];
const toNum = v => { const n = parseFloat(String(v).replace(/\s/g,"").replace(",", ".")); return isFinite(n) ? n : NaN; };
const byDateDesc = (a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0);

const INVESTOR = "p2"; // quem faz os investimentos (Bruno)
const S = { personal:[], auth:{}, names:{p1:"Maria",p2:"Bruno"}, monthly:250, settings:{}, trips:[], expenses:[], settlements:[], invest:[], cal:{}, albums:[], photos:[] };
let db = null, assets = null, dbState = "connecting";
let view = {name:"home"};
const HASH_VIEW = (location.hash||"").slice(1);
try { const v = JSON.parse(localStorage.getItem("vad-view")||"null"); if (v && v.name) view = v; } catch(e){}
if (HASH_VIEW==="invest") { view = {name:"invest"}; try { history.replaceState(null,"",location.pathname); } catch(e){} }
let calMonth = (()=>{ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })();

const N = p => S.names[p] || (p==="p1"?"Maria":"Bruno");
const other = p => p==="p1"?"p2":"p1";

/* ---------- toast ---------- */
let tT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove("on"),2400); }

/* ---------- db helpers ---------- */
let connecting = null;
async function w(fn, ok){
  if (!db && connecting) { try { await connecting; } catch(e){} }
  if (!db) { toast("Não foi possível aceder ao armazenamento. Recarregue a página."); return false; }
  try { await fn(); if (ok) toast(ok); return true; }
  catch(e){
    const c = e && e.code;
    if (c==="invalid_argument") toast("Não tem permissão para alterar estes dados.");
    else if (c==="quota_exceeded") toast("O armazenamento está cheio. Elimine alguns registos.");
    else toast("Não foi possível guardar. Tente novamente.");
    return false;
  }
}
const col = name => db.collection(name);
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const fmtFull = s => { const d = parseYmd(s); return d.getDate()+" de "+MESES[d.getMonth()]+" de "+d.getFullYear(); };
function fmtRange(a, b){
  if (!a && !b) return "";
  if (!a || !b || a===b) return fmtFull(a||b);
  const x = parseYmd(a), y = parseYmd(b);
  if (x.getFullYear()===y.getFullYear()){
    if (x.getMonth()===y.getMonth()) return x.getDate()+" a "+y.getDate()+" de "+MESES[y.getMonth()]+" de "+y.getFullYear();
    return x.getDate()+" de "+MESES[x.getMonth()]+" a "+y.getDate()+" de "+MESES[y.getMonth()]+" de "+y.getFullYear();
  }
  return fmtFull(a)+" a "+fmtFull(b);
}

/* ---------- computations ---------- */
function tripBalance(tid){
  let net = 0; // > 0 : p2 deve a p1
  for (const e of S.expenses) if (e.tripId===tid){
    const a = +e.amount||0;
    const share = e.split==="igual" ? a/2 : e.split==="outro" ? a : 0;
    net += e.payer==="p1" ? share : -share;
  }
  for (const s of S.settlements) if (s.tripId===tid){
    net += s.from==="p2" ? -(+s.amount||0) : (+s.amount||0);
  }
  net = Math.round(net*100)/100;
  if (Math.abs(net) < 0.01) return {net:0};
  return net>0 ? {net, from:"p2", to:"p1", amount:net} : {net, from:"p1", to:"p2", amount:-net};
}
function expShare(e){ const a = +e.amount||0, o = {p1:0,p2:0}, pay = e.payer==="p2"?"p2":"p1";
  if (e.split==="igual") { o.p1 = a/2; o.p2 = a/2; } else if (e.split==="outro") o[other(pay)] = a; else o[pay] = a; return o; }
const pctOf = (v,t) => t ? Math.round(v/t*100) : 0;
/* barra dividida Maria/Bruno; largura total = frac (0–1) do espaço disponível */
function splitBar(p1, p2, frac, label){
  const t = p1+p2; if (!t) return `<div class="track"><div class="sbar" style="width:0"></div></div>`;
  const tip = (who, v) => `${esc(label?label+" · ":"")}${esc(N(who))}: ${money(v)} (${pctOf(v,t)}%)`;
  return `<div class="track"><div class="sbar${frac>=0.999?" full":""}" style="width:${(frac*100).toFixed(1)}%" role="img" aria-label="${esc(label||"Divisão")}: ${esc(N("p1"))} ${money(p1)}, ${esc(N("p2"))} ${money(p2)}">
    ${p1>0?`<i class="m" style="flex:${p1}" data-tip="${tip("p1",p1)}"></i>`:""}${p2>0?`<i class="b" style="flex:${p2}" data-tip="${tip("p2",p2)}"></i>`:""}</div></div>`;
}
const tripTotal = tid => S.expenses.filter(e=>e.tripId===tid).reduce((s,e)=>s+(+e.amount||0),0);
function investTotals(){
  const t = {p1:0,p2:0};
  for (const i of S.invest) t[i.person==="p2"?"p2":"p1"] += +i.amount||0;
  return {...t, all:t.p1+t.p2};
}
/* transferência mensal: dia 30 (ou último dia do mês, em fevereiro) */
const monthKey = (d=new Date()) => d.getFullYear()+"-"+pad(d.getMonth()+1);
const MESES_CAP = m => MESES[m].charAt(0).toUpperCase()+MESES[m].slice(1);
const monthName = k => { const [y,m] = k.split("-").map(Number); return MESES[m-1]+" de "+y; };
function dueDay(d=new Date()){ return Math.min(30, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate()); }
function monthly(){
  const key = monthKey(), now = new Date();
  const base = +S.monthly || 0;
  const conv = S.invest.filter(i=>i.tripId && i.person!==INVESTOR && !i.deductedIn);
  const deduct = Math.round(conv.reduce((s,i)=>s+(+i.amount||0),0)*100)/100;
  const done = S.invest.find(i=>i.kind==="mensal" && i.month===key);
  const amount = Math.max(0, Math.round((base-deduct)*100)/100);
  const day = dueDay(now);
  return {key, base, conv, deduct, amount, done, day, due: !done && base>0 && now.getDate()>=day, daysLeft: day-now.getDate()};
}

/* anel contracetivo: ciclo de 28 dias a partir de uma data de remoção de referência
   dias 0–6 sem anel (período previsto) · dia 7 colocar anel novo · dias 7–27 com anel */
const RING_START = {on:false, removal:""}; // configurado nas Configurações (não fica escrito no código)
const dnum = s => { const [y,m,d] = s.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const addDays = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const ringCfg = () => { const r = S.ring; return r && r.on && r.removal ? r : null; };
function ringPos(s){ const r = ringCfg(); if (!r) return -1; const off = dnum(s)-dnum(r.removal); return off<0 ? -1 : off%28; }
const ringEvent = s => { const p = ringPos(s); return p===0 ? "remove" : p===7 ? "insert" : ""; };
const RING_TXT = {remove:"Retirar o anel", insert:"Colocar anel novo"};
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.5 6.6-.8z"/></svg>';
function nextRemoval(from=todayStr()){ const r = ringCfg(); if (!r) return null; const off = dnum(from)-dnum(r.removal); return off<=0 ? r.removal : addDays(r.removal, Math.ceil(off/28)*28); }
/* escala do Bruno: chega no 4.º dia de trabalho e fica em casa os dois dias seguintes (próxima chegada 6 dias depois)
   exceções: chega ao domingo -> só segunda em casa, próxima chegada na sexta (5 dias)
             chega à quinta   -> só sexta em casa, próxima chegada na quarta (6 dias) */
const BRUNO_START = {on:false, anchors:[]}; // configurado nas Configurações (não fica escrito no código)
const brunoCfg = () => { const b = S.bruno; return b && b.on && Array.isArray(b.anchors) && b.anchors.length ? b : null; };
let brunoCache = {key:"", map:new Map()};
function brunoMap(){
  const b = brunoCfg(); if (!b) return null;
  const anchors = [...b.anchors].sort(), key = anchors.join(",")+"|"+todayStr();
  if (brunoCache.key===key) return brunoCache.map;
  const map = new Map(), last = anchors[anchors.length-1];
  const horizon = addDays(todayStr() > last ? todayStr() : last, 430);
  anchors.forEach((a,i) => {
    const next = anchors[i+1];
    let cur = a;
    while (next ? cur < next : cur <= horizon){
      if (next && cur!==a && dnum(next)-dnum(cur) < 4) break; // previsão substituída pelo reajuste seguinte
      const dow = parseYmd(cur).getDay(), home = (dow===0 || dow===4) ? 1 : 2;
      map.set(cur, "arrive");
      for (let k=1;k<=home;k++){ const h = addDays(cur,k); if (!next || h < next) map.set(h, "home"); }
      cur = addDays(cur, dow===0 ? 5 : 6);
    }
  });
  brunoCache = {key, map}; return map;
}
/* dia de chegada: Bruno em casa nesse dia e não no dia anterior */
const isArrival = d => calTypes(d).includes("bruno") && !calTypes(addDays(d,-1)).includes("bruno");
const brunoArrive = d => { const m = brunoMap(); return !!m && m.get(d)==="arrive"; };
async function setBrunoArrival(day){
  const cur = brunoCfg() || BRUNO_START;
  const anchors = [...new Set([...(cur.anchors||[]).filter(a=>a<day), day])].sort();
  return w(()=>db.doc("config/settings").set({...S.settings, bruno:{on:true, anchors}, brunoInit:true}), "Escala reajustada a partir de "+fmtDate(day));
}
const predTypes = d => { const p = ringPos(d), out = p>=0 && p<=6 ? ["periodo"] : []; const m = brunoMap(); if (m && m.has(d)) out.push("bruno"); return out; };
const storedTypes = d => { const t = (S.cal[d] && Array.isArray(S.cal[d].types)) ? S.cal[d].types : [];
  return t.includes("ferias") ? [...new Set(t.flatMap(x => x==="ferias" ? ["ferias1","ferias2"] : [x]))] : t; };
const calTypes = d => { const off = (S.cal[d] && S.cal[d].off) || []; return [...new Set([...storedTypes(d), ...predTypes(d).filter(x=>!off.includes(x))])]; };
async function setRing(removal, msg){ const ring = {...(S.ring||RING_START), on:true, removal}; return w(()=>db.doc("config/settings").set({...S.settings, ring, ringInit:true}), msg); }
function nextDate(pred, from=new Date(), days=400){
  const d = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  for (let i=0;i<days;i++){ const s=ymd(d); if (pred(s)) return {date:s, in:i}; d.setDate(d.getDate()+1); }
  return null;
}
/* dia juntos: Bruno em casa ao fim de semana, ou os dois de férias no mesmo dia */
const isWeekend = s => { const g = parseYmd(s).getDay(); return g===0 || g===6; };
const together = s => { const t = calTypes(s); return (t.includes("bruno") && isWeekend(s)) || (t.includes("ferias1") && t.includes("ferias2")); };
const inDays = n => n===0 ? "hoje" : n===1 ? "amanhã" : "dentro de "+n+" dias";

/* ---------- navigation ---------- */
function go(name, extra={}){
  selMode = false; sel.clear(); if (name!=="trip" || extra.id!==view.id) tripWho = "all";
  view = {name, ...extra};
  try { localStorage.setItem("vad-view", JSON.stringify(view)); } catch(e){}
  closeDrawer(); render(); window.scrollTo({top:0});
}
function openDrawer(){ $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); $("#menuBtn").setAttribute("aria-expanded","true"); }
function closeDrawer(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); $("#menuBtn").setAttribute("aria-expanded","false"); }
$("#menuBtn").onclick = openDrawer;
document.querySelector('[data-act-drawer="logout"]').addEventListener("click", () => logout("Sessão terminada.")); $("#scrim").onclick = closeDrawer; $("#drawerClose").onclick = closeDrawer;
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));

/* ---------- sheet ---------- */
function openSheet(html, mount){
  $("#sheetBody").innerHTML = html + '<button class="btn ghost" data-close>Cancelar</button>';
  $("#sheet").classList.add("on"); $("#scrim2").classList.add("on");
  $("#sheetBody").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  if (mount) mount($("#sheetBody"));
  const f = $("#sheetBody").querySelector("input:not([type=radio]):not([type=checkbox]),select"); if (f && !f.dataset.nofocus) setTimeout(()=>f.focus({preventScroll:true}),260);
}
function closeSheet(){ $("#sheet").classList.remove("on"); $("#scrim2").classList.remove("on"); }
$("#scrim2").onclick = closeSheet;

function seg(name, opts, checked){
  return '<div class="seg" role="radiogroup">'+opts.map(([v,l],i)=>{
    const id = name+"_"+i;
    return '<input type="radio" name="'+name+'" id="'+id+'" value="'+esc(v)+'"'+(v===checked?" checked":"")+'><label for="'+id+'">'+esc(l)+'</label>';
  }).join("")+'</div>';
}

/* ---------- render ---------- */
let rq = false;
function render(){ if (rq) return; rq = true; requestAnimationFrame(()=>{ rq=false; draw(); }); }
function draw(){
  $("#brandSub").textContent = N("p1")+" e "+N("p2");
  $("#menuBtn").hidden = !SESSION;
  if (!SESSION) { document.body.classList.remove("has-fab"); $("#main").innerHTML = vLogin(); bindLogin(); return; }
  document.querySelectorAll("[data-go]").forEach(b => b.classList.toggle("on", b.dataset.go===view.name || (view.name==="trip"&&b.dataset.go==="trips") || (view.name==="album"&&b.dataset.go==="photos")));
  const V = {home:vHome, trips:vTrips, trip:vTrip, invest:vInvest, mine:vMine, cal:vCal, photos:vPhotos, album:vAlbum, settings:vSettings}[view.name] || vHome;
  let html = "";
  const sm = window.claude && window.claude.storageMode ? window.claude.storageMode() : "";
  if (dbState==="on" && sm==="mem") html += '<div class="banner">Este navegador não permite guardar dados (possivelmente devido ao modo de navegação privada). As alterações serão perdidas ao fechar a aplicação.</div>';
  if (dbState==="off") html += '<div class="banner">Não foi possível aceder ao armazenamento deste navegador. Os dados não serão guardados. Evite utilizar o modo de navegação privada.</div>';
  const F = {
    trips: {act:"newTrip", label:"Nova viagem"},
    trip: S.trips.some(t=>t.id===view.id) ? {act:"newExp", label:"Adicionar despesa"} : null,
    invest: {act:"newInv", label:"Nova contribuição"},
    mine: ME() ? {act:"newPers", label:"Registar gasto"} : null,
    cal: {act:"day", v:todayStr(), label:"Registar dia"},
    photos: assets ? {act:"newAlbum", label:"Novo álbum"} : null,
    album: assets && !selMode && S.albums.some(a=>a.id===view.id) ? {act:"addPhotos", label:"Carregar fotografias"} : null,
  }[view.name];
  if (F) html += `<button class="fab" data-act="${F.act}"${F.v?` data-v="${F.v}"`:""} aria-label="${esc(F.label)}" title="${esc(F.label)}"${F.act==="addPhotos"&&uploading?" disabled":""}>${F.act==="addPhotos"&&uploading?`<span class="fab-busy">${esc(uploading.replace(/^A carregar /,"").replace("…",""))}</span>`:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'}</button>`;
  document.body.classList.toggle("has-fab", !!F);
  $("#main").innerHTML = html + V();
  bindMain();
}

/* Início */
function vHome(){
  const now = new Date(), t = todayStr();
  const tt = calTypes(t);
  const brunoHome = tt.includes("bruno");
  const nb = nextDate(s=>calTypes(s).includes("bruno"));
  const nt = nextDate(together);
  const open = S.trips.map(tr=>({tr, b:tripBalance(tr.id)})).filter(x=>x.b.net);
  const it = investTotals();
  const lastPhoto = [...S.photos].sort((a,b)=>(b.addedAt||0)-(a.addedAt||0))[0];
  const album = lastPhoto && S.albums.find(a=>a.id===lastPhoto.albumId);
  const extra = [];
  if (tt.includes("ferias1") && tt.includes("ferias2")) extra.push("Ambos de férias.");
  else if (tt.includes("ferias1")) extra.push(N("p1")+" de férias.");
  else if (tt.includes("ferias2")) extra.push(N("p2")+" de férias.");
  if (tt.includes("periodo")) extra.push("Período registado para hoje.");
  const tom = addDays(t,1), ringToday = ringEvent(t), ringTom = ringEvent(tom);

  const mm = monthly();
  const me = ME(), ny = now.getFullYear(), nm = now.getMonth();
  const mineNow = me ? monthSum(ny, nm) : 0, pmD = new Date(ny, nm-1, 1), minePrev = me ? monthSum(pmD.getFullYear(), pmD.getMonth()) : 0;
  const pendTotal = open.reduce((s,x)=>s+x.b.amount,0);
  const ICON = {
    wallet:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16" height="11" rx="2.5"/><path d="M16 13.5h.01"/>',
    grow:'<path d="M4 17l5-5 4 3 7-7"/><path d="M15 8h5v5"/>',
    scale:'<path d="M12 4v16M6 20h12"/><path d="M5 8h14"/><path d="M5 8l-2.5 5a2.8 2.8 0 0 0 5 0z"/><path d="M19 8l-2.5 5a2.8 2.8 0 0 0 5 0z"/>',
    home:'<path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/>',
    heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
    photo:'<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20 16l-5-5-8 8"/>'
  };
  const ico = k => `<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></span>`;
  const tile = (act, v, icon, label, value, sub, extra="") => `<button class="glass tile" data-act="${act}"${v?` data-v="${v}"`:""}>
      <div class="tile-h">${ico(icon)}<span class="chev" aria-hidden="true">›</span></div>
      <div class="eyebrow">${label}</div>
      <div class="tv num">${value}</div>
      ${extra}
      <div class="ts">${sub}</div>
    </button>`;
  const diff = mineNow - minePrev;
  const tMine = me ? tile("go","mine","wallet","Os meus gastos", money(mineNow),
      minePrev ? `${diff>0?"+":diff<0?"−":""}${money(Math.abs(diff))} vs. ${MESES[pmD.getMonth()]}` : `${MESES[nm].charAt(0).toUpperCase()+MESES[nm].slice(1)} · privado`) : "";
  const tInv = tile("go","invest","grow","Investido", money(it.all),
      it.all ? `${esc(N("p1"))} ${Math.round(it.p1/it.all*100)}% · ${esc(N("p2"))} ${Math.round(it.p2/it.all*100)}%` : "Sem contribuições",
      it.all ? `<div class="mini"><i class="m" style="flex:${it.p1||0.0001}"></i><i class="b" style="flex:${it.p2||0.0001}"></i></div>` : "");
  const tBal = tile(open.length===1?"trip":"go", open.length===1?esc(open[0].tr.id):"trips","scale","Por acertar", open.length ? money(pendTotal) : "0,00 €",
      open.length ? (open.length===1 ? `${esc(N(open[0].b.from))} deve · ${esc(open[0].tr.name)}` : `${open.length} viagens por acertar`) : "Tudo regularizado");
  const tBru = tile("go","cal","home", brunoHome ? esc(N("p2"))+" em casa" : esc(N("p2"))+" chega",
      brunoHome ? "Hoje" : nb ? (nb.in===1 ? "Amanhã" : "Em "+nb.in+" dias") : "—",
      brunoHome ? (nb && nextDate(s=>!calTypes(s).includes("bruno")) ? "Até "+fmtShort(addDays(nextDate(s=>!calTypes(s).includes("bruno")).date,-1)) : "Bom tempo juntos") : nb ? esc(fmtShort(nb.date)) : "Sem chegada prevista");
  return `
  <div>
    <div class="eyebrow">${esc(DIAS[now.getDay()])}, ${now.getDate()} de ${MESES[now.getMonth()]}</div>
    <h1>${me ? "Olá, "+esc(N(me))+"." : "Bem-vindos."}</h1>
  </div>
  ${mm.due ? `<button class="glass tile wide alert" data-act="go" data-v="invest">
      <div class="tile-h">${ico("grow")}<span class="chev" aria-hidden="true">›</span></div>
      <div class="eyebrow">Transferência mensal pendente</div>
      <div class="tv num">${money(mm.amount)}</div>
      <div class="ts">${esc(N("p1"))} → ${esc(N(INVESTOR))} · toque para registar</div>
    </button>` : ""}
  <button class="glass tile wide hero" data-act="go" data-v="cal">

/* Os meus gastos (pessoal: cada telemóvel/utilizador vê apenas os seus) */
const PCATS = ["Habitação","Supermercado","Restauração","Transportes","Saúde","Lazer","Vestuário e compras","Cuidado pessoal","Subscrições","Viagens","Outras despesas"];
const PCATS_MANUAL = PCATS.filter(c=>c!=="Viagens");
/* ---------- início de sessão ----------
   Cada pessoa tem palavra-passe própria. Da palavra-passe deriva-se (PBKDF2, 310 000 iterações) uma chave AES-GCM
   que cifra os gastos pessoais; a palavra-passe nunca é guardada, só um verificador. */
let SESSION = null; // {user:"p1"|"p2", key:CryptoKey, salt}
const ME = () => SESSION ? SESSION.user : null;
window.vadCurrentUser = ME;
const tenc = new TextEncoder(), tdec = new TextDecoder();
const b64e = u8 => { let s = ""; const a = new Uint8Array(u8); for (let i=0;i<a.length;i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i,i+0x8000)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const PBKDF2_ITER = 310000;
async function deriveKeys(pass, saltB64, iter){
  const base = await crypto.subtle.importKey("raw", tenc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", salt:b64d(saltB64), iterations:iter||PBKDF2_ITER, hash:"SHA-256"}, base, 512));
  const key = await crypto.subtle.importKey("raw", bits.slice(0,32), "AES-GCM", false, ["encrypt","decrypt"]);
  const ver = b64e(await crypto.subtle.digest("SHA-256", bits.slice(32)));
  return {key, ver};
}
async function encObj(key, obj){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, tenc.encode(JSON.stringify(obj))); return {iv:b64e(iv), ct:b64e(ct)}; }
async function decObj(key, d){ const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(d.iv)}, key, b64d(d.ct)); return JSON.parse(tdec.decode(pt)); }
window.vadCrypto = {deriveKeys, encObj, decObj};
let loginUser = null, loginBusy = false, showOtherAcc = false;
const authDoc = p => S.auth[p];
async function doLogin(user, pass){
  const a = authDoc(user); if (!a) return false;
  const k = await deriveKeys(pass, a.salt, a.iter);
  if (k.ver !== a.ver) return false;
  SESSION = {user, key:k.key, salt:a.salt}; loginUser = null;
  await refreshPersonal(true); scheduleNative(); if (window.vadSync) window.vadSync.setUser(user); return true;
}
async function createAccount(user, pass){
  const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
  const k = await deriveKeys(pass, salt, PBKDF2_ITER);
  await db.doc("auth/"+user).set({salt, iter:PBKDF2_ITER, ver:k.ver, createdAt:Date.now()});
  SESSION = {user, key:k.key, salt}; loginUser = null;
  await refreshPersonal(true); scheduleNative(); if (window.vadSync) window.vadSync.setUser(user);
}
function logout(msg){ if (window.vadSync) window.vadSync.setUser(null); SESSION = null; loginUser = null; showOtherAcc = false; S.personal = []; closeSheet(); closeDrawer(); $("#lightbox").hidden = true; go("home"); if (msg) toast(msg); }
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (SESSION && hiddenAt && Date.now()-hiddenAt > 5*60*1000) logout("Sessão terminada por inatividade.");

/* gastos pessoais: só os do utilizador com sessão iniciada são decifrados */
let lastPersonalDocs = [];
async function refreshPersonal(migrate){
  if (!SESSION) { S.personal = []; return; }
  const me = SESSION.user, out = [], legacy = [];
  for (const d of lastPersonalDocs){
    if (!d || d.owner !== me) continue;
    if (d.ct) { try { out.push({id:d.id, owner:me, ...(await decObj(SESSION.key, d))}); } catch(e){} }
    else { const {id, ...rest} = d; out.push({id, ...rest}); legacy.push({id, ...rest}); }
  }
  S.personal = out; render();
  if (migrate) for (const x of legacy){ const {id, owner, ...data} = x; try { await col("personal").doc(id).set({owner, ...(await encObj(SESSION.key, data))}); } catch(e){} }
}
async function changePassword(oldPass, newPass){
  const me = SESSION.user, a = authDoc(me);
  const k0 = await deriveKeys(oldPass, a.salt, a.iter); if (k0.ver !== a.ver) return false;
  const salt = b64e(crypto.getRandomValues(new Uint8Array(16))); const k1 = await deriveKeys(newPass, salt, PBKDF2_ITER);
  for (const x of S.personal){ const {id, owner, virt, ...data} = x; if (virt) continue; await col("personal").doc(id).set({owner:me, ...(await encObj(k1.key, data))}); }
  await db.doc("auth/"+me).set({salt, iter:PBKDF2_ITER, ver:k1.ver, createdAt:a.createdAt||Date.now()});
  SESSION = {user:me, key:k1.key, salt}; return true;
}
/* importação de cópias: gastos pessoais só do utilizador com sessão; contas deste telemóvel mantêm-se */
window.vadPrepareImport = async (bdocs, localDocs) => {
  const me = ME(), out = {};
  for (const [k,v] of Object.entries(bdocs)) if (!k.startsWith("auth/") && !k.startsWith("personal/")) out[k] = v;
  for (const [k,v] of Object.entries(localDocs)) if (k.startsWith("auth/") || k.startsWith("personal/")) out[k] = v;
  if (!me) return out;
  const mine = Object.entries(bdocs).filter(([k,v]) => k.startsWith("personal/") && v && v.owner===me);
  const bAuth = bdocs["auth/"+me], lAuth = localDocs["auth/"+me];
  let oldKey = null;
  if (mine.some(([k,v])=>v.ct) && bAuth && lAuth && bAuth.salt !== lAuth.salt) {
    const pass = prompt("Os seus gastos pessoais desta cópia estão protegidos com a palavra-passe que tinha quando a cópia foi criada. Indique essa palavra-passe (deixe em branco para não os importar):");
    if (pass) { const k = await deriveKeys(pass, bAuth.salt, bAuth.iter); if (k.ver === bAuth.ver) oldKey = k.key; else alert("Palavra-passe incorreta. Os gastos pessoais desta cópia não foram importados."); }
  }
  for (const [k,v] of mine){
    if (!v.ct) { out[k] = v; continue; }                       // formato antigo: é cifrado ao iniciar sessão
    if (!bAuth || !lAuth || bAuth.salt === lAuth.salt) { out[k] = v; continue; }
    if (oldKey) { try { const data = await decObj(oldKey, v); out[k] = {owner:me, ...(await encObj(SESSION.key, data))}; } catch(e){} }
  }
  return out;
};

function tripDerived(me){
  const tn = id => (S.trips.find(t=>t.id===id)||{}).name;
  const out = [];
  S.expenses.forEach(e=>{ const name = tn(e.tripId); if (!name || (e.payer||"p1")!==me) return;
    out.push({id:"x-"+e.id, virt:true, tripId:e.tripId, owner:me, amount:+e.amount||0, desc:(e.desc||catL(e.cat)), sub:"Viagem "+name+" · "+catL(e.cat), cat:"Viagens", date:e.date || ymd(new Date(e.createdAt||Date.now())), createdAt:e.createdAt||0}); });
  S.settlements.forEach(st=>{ const name = tn(st.tripId); if (!name || st.mode!=="pago" || (st.from!==me && st.to!==me)) return;

  return out;
}
const myPersonal = () => { const me = ME(); return me ? [...S.personal.filter(x=>x.owner===me), ...tripDerived(me)] : []; };
const monthSum = (y,m) => myPersonal().filter(x=>(x.date||"").startsWith(mKey(y,m))).reduce((s,x)=>s+(+x.amount||0),0);

  <div class="glass card">

function syncCard(){

  let body;
  if (!st.signedIn) body = `<div class="small muted">Sincroniza viagens, calendário, investimentos e fotografias entre os dois telemóveis. Tudo é cifrado no telemóvel antes de ser enviado: nem a Google consegue ler o conteúdo. Os seus gastos pessoais continuam privados.</div>
    <button class="btn" type="button" data-act="syncOn" style="align-self:flex-start">Ativar sincronização</button>`;
  else if (!st.hasKey) body = `<div class="small">Sessão Firebase: <strong>${esc(st.email||"")}</strong>. Falta indicar a palavra-passe do casal.</div>

    <div class="btns"><button class="btn ghost" type="button" data-act="syncNow">Sincronizar agora</button><button class="btn ghost" type="button" data-act="syncOff">Desligar neste telemóvel</button></div>`;

async function syncKeySheet(){
  let exists = null; try { exists = await window.vadSync.coupleExists(); } catch(e){ toast("Sem acesso à base de dados. Confirme as regras no Firebase."); return; }
  openSheet(`<h2>Palavra-passe do casal</h2>
  <p class="small">${exists ? "Indique a palavra-passe do casal definida no outro telemóvel." : "Defina a palavra-passe do casal. É ela que cifra os vossos dados partilhados. <strong>Tem de ser a mesma nos dois telemóveis</strong> e não pode ser recuperada: guardem-na num local seguro."}</p>
  <form id="f">
    <label class="f" for="ck1">Palavra-passe do casal<input class="inp" type="password" id="ck1" autocomplete="new-password" required minlength="${exists?1:10}"></label>
    ${exists?"":`<label class="f" for="ck2">Repetir<input class="inp" type="password" id="ck2" autocomplete="new-password" required minlength="10"></label><div class="small muted">Mínimo de 10 caracteres. Sugestão: uma frase com 4 palavras.</div>`}
    <button class="btn" type="submit">${exists?"Ligar":"Definir e ligar"}</button>

    catch(e){ btn.disabled = false; btn.textContent = exists?"Ligar":"Definir e ligar"; toast(e && e.code==="wrong_couple" ? "Palavra-passe do casal incorreta." : "Não foi possível ligar."); }
  });

function syncAuthSheet(){
  const remote = window.vadSyncAuthConflict; if (!remote) return;
  openSheet(`<h2>Palavra-passe do outro telemóvel</h2>
  <p class="small">Os seus gastos pessoais do outro telemóvel estão protegidos com a palavra-passe que usava lá. Indique-a para os juntar a este telemóvel. A partir daí, essa passa a ser a sua palavra-passe também aqui.</p>
  <form id="f"><label class="f" for="op">Palavra-passe usada no outro telemóvel<input class="inp" type="password" id="op" required></label><button class="btn" type="submit">Confirmar</button></form>`,
  b => b.querySelector("#f").onsubmit = async ev => { ev.preventDefault();
    try {
      const k = await deriveKeys($("#op").value, remote.salt, remote.iter); if (k.ver !== remote.ver) { toast("Palavra-passe incorreta."); return; }
      const me = SESSION.user;
      for (const x of S.personal){ const {id, owner, virt, ...data} = x; if (virt) continue; await col("personal").doc(id).set({owner:me, ...(await encObj(k.key, data))}); }
      await db.doc("auth/"+me).set(remote);
      SESSION = {user:me, key:k.key, salt:remote.salt}; window.vadSyncAuthConflict = null;
      closeSheet(); toast("Pronto. Use esta palavra-passe para entrar."); await refreshPersonal(false); window.vadSync.now();
    } catch(e){ toast("Não foi possível concluir."); }
  });
}

let tipT;
function showTip(el){ const t = $("#tip"), r = el.getBoundingClientRect(); t.textContent = el.dataset.tip; t.hidden = false;
  const x = Math.max(120, Math.min(window.innerWidth-120, r.left + r.width/2)); t.style.left = x+"px"; t.style.top = (r.top)+"px";
  clearTimeout(tipT); tipT = setTimeout(()=>{ t.hidden = true; }, 2600); }
const hideTip = () => { $("#tip").hidden = true; };
$("#main").addEventListener("pointerover", ev => { const el = ev.target.closest("[data-tip]"); if (el && ev.pointerType==="mouse") showTip(el); });
$("#main").addEventListener("pointerout", ev => { if (ev.target.closest("[data-tip]") && ev.pointerType==="mouse") hideTip(); });
addEventListener("scroll", hideTip, {passive:true});

function tripSheet(tr){

      <label class="f" for="td1">Início<input class="inp" type="date" id="td1" value="${esc(tr?.start||"")}"></label>
      <label class="f" for="td2">Fim<input class="inp" type="date" id="td2" value="${esc(tr?.end||"")}"></label>
    </div>
    ${tr && tr.dates && !tr.start ? `<div class="small muted">Datas registadas: ${esc(tr.dates)}</div>` : ""}

    const name = $("#tn").value.trim(); if (!name) return;

    if (!dates && tr && tr.dates && !tr.start) dates = tr.dates; // mantém datas antigas escritas à mão
    if (tr){ if (await w(()=>col("trips").doc(tr.id).update({name,dates,start,end}),"Viagem guardada")) closeSheet(); }

/* app Android: agenda notificações reais (transferência no dia 30 e datas do anel) */
async function scheduleNative(){
  const P = LN(); if (!P) return;
  try {
    const perm = await P.checkPermissions(); nativeNotifOn = perm.display==="granted"; if (!nativeNotifOn) return;
    const pend = await P.getPending(); if (pend.notifications.length) await P.cancel({notifications: pend.notifications.map(n=>({id:n.id}))});
    const list = [
      {id:3000, title:"Transferência mensal para investir", body:"Hoje é dia de transferir o valor mensal de "+N("p1")+" para "+N(INVESTOR)+". Consulte o valor em Investimentos.", schedule:{on:{day:30, hour:9, minute:0}, allowWhileIdle:true}},
      {id:3001, title:"Transferência mensal para investir", body:"Hoje é dia de transferir o valor mensal de "+N("p1")+" para "+N(INVESTOR)+". Consulte o valor em Investimentos.", schedule:{on:{month:2, day:28, hour:9, minute:0}, allowWhileIdle:true}},
    ];
    if (ringCfg() && ME()==="p1") { let r = nextRemoval(); for (let i=0;i<8 && r;i++){ 
      const at1 = parseYmd(r); at1.setHours(9,0,0,0); const at2 = parseYmd(addDays(r,7)); at2.setHours(9,0,0,0);
      if (at1 > new Date()) list.push({id:3100+i*2, title:"Anel contracetivo", body:"Hoje: retirar o anel.", schedule:{at:at1, allowWhileIdle:true}});
      if (at2 > new Date()) list.push({id:3101+i*2, title:"Anel contracetivo", body:"Hoje: colocar anel novo.", schedule:{at:at2, allowWhileIdle:true}});
      r = addDays(r,28); } }
    await P.schedule({notifications:list});
  } catch(e){}
}
async function enableNotifications(){
  if (LN()) { try { const p = await LN().requestPermissions(); if (p.display!=="granted") { toast("As notificações não foram autorizadas."); return; } await scheduleNative(); toast("Notificações ativadas"); render(); } catch(e){ toast("Não foi possível ativar as notificações."); } return; }
  if (!notifSupported()) { toast("Este dispositivo não suporta notificações nesta aplicação. Utilize o lembrete no calendário."); return; }
  let p = Notification.permission;
  if (p !== "granted") p = await Notification.requestPermission();
  if (p !== "granted") { toast("As notificações não foram autorizadas."); render(); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    if (reg.periodicSync) { try { await reg.periodicSync.register("vad-mensal", {minInterval: 12*60*60*1000}); } catch(e){} }
  } catch(e){}

/* dias seguintes marcados por defeito:
   - Bruno em casa: domingo -> só segunda; quinta -> só sexta; restantes dias -> os dois dias seguintes

function followDays(s, type){
  const d = parseYmd(s), dow = d.getDay();
  const n = type==="periodo" ? 7 : (dow===0 || dow===4) ? 1 : 2, out = [];
  for (let i=1;i<=n;i++){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()+i); out.push(ymd(x)); }
  return out;
}

const OK_TYPES = ["image/jpeg","image/png","image/webp","image/gif"];
async function prep(file){
  try {
    const bmp = await createImageBitmap(file);
    const max = 1800, k = Math.min(1, max/Math.max(bmp.width,bmp.height));
    if (k===1 && OK_TYPES.includes(file.type) && file.size < 9e5) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",0.82));
    if (blob) return blob;
  } catch(e){}
  return OK_TYPES.includes(file.type) ? file : null;
}

  if (!db){ dbState = "off"; render(); return; }
  dbState = "on";
  try { assets = await window.claude.use("assets"); } catch(e){ assets = null; }
  const onErr = () => { toast("A ligação aos dados foi interrompida. Recarregue a página."); };
  const listen = (name, key) => col(name).onSnapshot(s => { S[key] = s.docs.map(d => ({id:d.id, ...(d.data()||{})})); render(); if (!$("#lightbox").hidden) drawLightbox(); }, onErr);
  listen("trips","trips"); listen("expenses","expenses"); listen("settlements","settlements");
  listen("investments","invest"); col("personal").onSnapshot(s => { lastPersonalDocs = s.docs.map(d => ({id:d.id, ...(d.data()||{})})); refreshPersonal(false); }, onErr);
  col("auth").onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()||{}); S.auth = o; render(); }, onErr); listen("albums","albums"); listen("photos","photos");
  col("calendar").onSnapshot(s => { const o = {}; s.docs.forEach(d => o[d.id] = d.data()||{}); S.cal = o; render(); }, onErr);
  db.doc("config/settings").onSnapshot(s => { if (s.exists){ const d = s.data()||{}; S.settings = d; S.names = {p1:d.p1||"Maria", p2:d.p2||"Bruno"}; S.monthly = d.monthly ?? 250; S.ring = d.ring || null; S.bruno = d.bruno || null; } scheduleNative(); render(); checkMonthlyNotification(); }, onErr);
  // correção: conversões antigas ficavam em nome de quem devia; passam para quem tinha a receber
  for (const i of S.invest.filter(i=>i.tripId && !i.v)) {
    const st = S.settlements.find(s=>("t-"+s.id)===i.id);
    const person = st ? st.to : other(i.person);
    const tr = S.trips.find(t=>t.id===i.tripId);
    try { await col("investments").doc(i.id).set({...i, id:undefined, person, v:2, note: tr ? "Viagem "+tr.name+": dívida de "+N(other(person))+" convertida em investimento" : i.note}); } catch(e){}
  }
  render();
})();
})();
</script>
<script>if("serviceWorker" in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
